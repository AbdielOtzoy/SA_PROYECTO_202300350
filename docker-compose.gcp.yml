name: yousac

services:
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${IDENTITY_DB_USER:-yousac}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?defina IDENTITY_DB_PASSWORD}
      POSTGRES_DB: identity_db
    volumes:
      - identity_data:/var/lib/postgresql/data
      - ./databases/identity:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${IDENTITY_DB_USER:-yousac} -d identity_db
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER:-yousac}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?defina CATALOG_DB_PASSWORD}
      POSTGRES_DB: catalog_db
    volumes:
      - catalog_data:/var/lib/postgresql/data
      - ./databases/catalog:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CATALOG_DB_USER:-yousac} -d catalog_db
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-yousac}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?defina NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: notification_db
    volumes:
      - notification_data:/var/lib/postgresql/data
      - ./databases/notifications:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${NOTIFICATION_DB_USER:-yousac} -d notification_db
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  playback-db:
    image: mongo:7
    volumes:
      - playback_data:/data/db
      - ./databases/playback:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'db.adminCommand("ping").ok' localhost:27017/admin | grep 1
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  analytics-db:
    image: mongo:7
    volumes:
      - analytics_data:/data/db
      - ./databases/analytics:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'db.adminCommand("ping").ok' localhost:27017/admin | grep 1
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    env_file: ${GCP_ENV_FILE:-.env.gcp}
    depends_on:
      identity-db:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    env_file: ${GCP_ENV_FILE:-.env.gcp}
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped

  playback:
    build:
      context: .
      dockerfile: services/playback/Dockerfile
    env_file: ${GCP_ENV_FILE:-.env.gcp}
    environment:
      VIDEO_STORAGE_MODE: gcs
      GCS_BUCKET: ${GCS_BUCKET:?defina GCS_BUCKET}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:?defina GCS_PROJECT_ID}
      GCS_PREFIX: ${GCS_PREFIX:-}
    depends_on:
      playback-db:
        condition: service_healthy
      catalog:
        condition: service_started
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    env_file: ${GCP_ENV_FILE:-.env.gcp}
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog:
        condition: service_started
      identity:
        condition: service_started
      playback:
        condition: service_started
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    env_file: ${GCP_ENV_FILE:-.env.gcp}
    depends_on:
      notification-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file: ${GCP_ENV_FILE:-.env.gcp}
    environment:
      TLS_CERT_FILE: /app/tls/server.crt
      TLS_KEY_FILE: /app/tls/server.key
    volumes:
      - ${TLS_DIR:?defina TLS_DIR}:/app/tls:ro
    depends_on:
      - identity
      - catalog
      - playback
      - analytics
      - notifications
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: /api
    ports:
      - '443:3000'
    volumes:
      - ${TLS_DIR:?defina TLS_DIR}:/app/tls:ro
      - ./infrastructure/tls/frontend-nginx-gcp.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  identity_data: {}
  catalog_data: {}
  notification_data: {}
  playback_data: {}
  analytics_data: {}
  redis_data: {}
