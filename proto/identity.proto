syntax = "proto3";
package yousac.identity.v1;

service IdentityService {
  rpc Register(RegisterRequest) returns (AuthReply);
  rpc Login(LoginRequest) returns (AuthReply);
  rpc GetSession(SessionRequest) returns (SessionReply);
  rpc ListEnrollments(EnrollmentsRequest) returns (EnrollmentsReply);
  rpc ChangeRole(ChangeRoleRequest) returns (RoleReply);
}
message RegisterRequest { string email = 1; string password = 2; string full_name = 3; }
message LoginRequest { string email = 1; string password = 2; }
message AuthReply { string token = 1; User user = 2; }
message SessionRequest { string user_id = 1; }
message SessionReply { User user = 1; }
message User { string id = 1; string email = 2; string full_name = 3; repeated string roles = 4; repeated string permissions = 5; }
message EnrollmentsRequest { string user_id = 1; string semester = 2; string status = 3; string credentials = 4; }
message Enrollment { string course_id = 1; string semester_id = 2; string status = 3; string credentials = 4; }
message EnrollmentsReply { repeated Enrollment enrollments = 1; }
message ChangeRoleRequest { string user_id = 1; string role = 2; bool assign = 3; string actor_id = 4; }
message RoleReply { User user = 1; }

