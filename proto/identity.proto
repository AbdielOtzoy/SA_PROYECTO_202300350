syntax = "proto3";

package yousac.identity.v1;

service IdentityService {
  rpc Register(RegisterRequest) returns (AuthReply);
  rpc Login(LoginRequest) returns (AuthReply);
  rpc OAuthLogin(OAuthLoginRequest) returns (AuthReply);
  rpc RequestPasswordReset(PasswordResetRequest) returns (PasswordResetReply);
  rpc ResetPassword(ResetPasswordRequest) returns (PasswordResetResult);
  rpc GetSession(SessionRequest) returns (SessionReply);
  rpc ListEnrollments(EnrollmentsRequest) returns (EnrollmentsReply);
  rpc ListNotificationRecipients(NotificationRecipientsRequest) returns (NotificationRecipientsReply);
  rpc ChangeRole(ChangeRoleRequest) returns (RoleReply);
  rpc ListUsers(UsersRequest) returns (UsersReply);
  rpc ImportEnrollmentsCsv(CsvImportRequest) returns (ImportReply);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthReply {
  string token = 1;
  User user = 2;
  bool created = 3;
}

message SessionRequest {
  string user_id = 1;
}

message SessionReply {
  User user = 1;
}

message OAuthLoginRequest {
  string email = 1;
  string full_name = 2;
  bool verified = 3;
}

message PasswordResetRequest {
  string email = 1;
}

message PasswordResetReply {
  bool accepted = 1;
  string user_id = 2;
  string recipient = 3;
  string reset_token = 4;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message PasswordResetResult {
  bool accepted = 1;
  User user = 2;
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
  bool is_active = 6;
}

message EnrollmentsRequest {
  string user_id = 1;
  string semester = 2;
  string status = 3;
  string credentials = 4;
}

message Enrollment {
  string course_id = 1;
  string semester_id = 2;
  string status = 3;
  string credentials = 4;
}

message EnrollmentsReply {
  repeated Enrollment enrollments = 1;
}

message NotificationRecipientsRequest {
  string role = 1;
  string course_id = 2;
  string status = 3;
}

message NotificationRecipient {
  string user_id = 1;
  string recipient = 2;
  string full_name = 3;
}

message NotificationRecipientsReply {
  repeated NotificationRecipient recipients = 1;
}

message ChangeRoleRequest {
  string user_id = 1;
  string role = 2;
  bool assign = 3;
  string actor_id = 4;
}

message RoleReply {
  User user = 1;
}

message UsersRequest {}

message UsersReply {
  repeated User users = 1;
}

message CsvImportRequest {
  bytes content = 1;
  string filename = 2;
}

message ImportReply {
  bool accepted = 1;
  int32 rows = 2;
  string procedure = 3;
}
