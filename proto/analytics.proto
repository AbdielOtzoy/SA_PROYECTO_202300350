syntax = "proto3";
package yousac.analytics.v1;
service AnalyticsService { rpc RecordView(ViewRequest) returns (Empty); rpc MostViewed(MostViewedRequest) returns (MostViewedReply); }
message ViewRequest { string user_id = 1; string recording_id = 2; }
message MostViewedRequest { string week_start = 1; }
message MostViewedItem { string recording_id = 1; int32 views = 2; }
message MostViewedReply { repeated MostViewedItem items = 1; }
message Empty {}

